<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wedding invitation</title>
    <meta name="description" content="Invitation, functions, travel and stay." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The stylesheet for ACTIVE_PAIRING, kept in the initial HTML so the preload
         scanner finds it before the module script is parsed. data-pairing-src is
         how fonts.js recognises it and avoids fetching the same faces twice; the
         href must match PAIRINGS['prata-karla'].href, and a dev assertion warns
         if the two drift. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap"
      rel="stylesheet"
      data-pairing-src="cormorant-jost"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
